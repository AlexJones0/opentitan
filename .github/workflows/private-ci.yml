name: Private CI
on:
  workflow_run:
    workflows: ["Quick Lint"]
    types:
      - completed

permissions:
  contents: write # For repository dispatch

jobs:
  trigger:
    # We should only run Private CI on `master`, currently.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.event == 'push' ||
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].base.ref == 'master'
        )
      )
    name: Trigger Private CI
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Private CI
        uses: actions/github-script@v7
        with:
          script: |
            const payload = {
              sha: context.payload.workflow_run.event === 'pull_request' ? context.payload.pull_request.head.sha : context.sha,
              pull_request: context.issue.number,
              inputs: {
                // For push events, also send branch name (for batching)
                branch: context.payload.workflow_run.event === 'pull_request' ? undefined : context.ref,
                run_name: context.payload.workflow_run.event === 'pull_request' ? context.payload.pull_request.title : context.payload.head_commit.message.split('\n')[0],
              },
            };
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'cross-repo-ci',
              client_payload: {
                ...payload,
                target: `${context.repo.owner}/opentitan-private-ci/master/private-ci.yml`,
              }
            });
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'cross-repo-ci',
              client_payload: {
                ...payload,
                target: `${context.repo.owner}/opentitan-realintent-ci/main/ascentlint-ci.yml`,
              }
            });
